<?xml version="1.0" encoding="UTF-8" standalone="no" ?>
<!-- Réglages par défaut du logiciel CAM2027 (UserParameterTemplate de branding.xml), lus au premier lancement. -->
<FCParameters>
  <FCParamGroup Name="Root">
    <FCParamGroup Name="BaseApp">
      <FCParamGroup Name="Preferences">
        <FCParamGroup Name="General">
          <FCText Name="Language">French</FCText>
          <FCText Name="AutoloadModule">CAM2027Workbench</FCText>
          <FCBool Name="ShowSplasher" Value="1"/>
        </FCParamGroup>
        <FCParamGroup Name="Mod">
          <FCParamGroup Name="Start">
            <FCBool Name="closeStart" Value="1"/>
          </FCParamGroup>
          <FCParamGroup Name="Path">
            <FCParamGroup Name="PostProcessor">
              <FCText Name="DefaultPostProcessor">grbl</FCText>
              <FCText Name="DefaultPostProcessorArgs">--no-show-editor --precision=3</FCText>
            </FCParamGroup>
          </FCParamGroup>
        </FCParamGroup>
      </FCParamGroup>
    </FCParamGroup>
  </FCParamGroup>
</FCParameters>
